<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial;
}
.card {
    background: linear-gradient(135deg, #22c55e, #15803d);
    border-radius: 20px;
    padding: 20px;
    margin: 20px;
}
.balance {
    font-size: 32px;
}
button {
    width: 90%;
    margin: 20px;
    padding: 15px;
    font-size: 18px;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="card">
    <div>💳 Игровая карта</div>
    <div class="balance" id="balance">0 💰</div>
</div>

<button onclick="clickMoney()">🖱 Клик</button>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let balance = 0;

function clickMoney() {
    balance++;
    document.getElementById("balance").innerText = balance + " 💰";
}
</script>

</body>
</html>
