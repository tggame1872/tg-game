<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Telegram Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    margin: 20px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #22c55e, #15803d);
}

.title {
    font-size: 14px;
    opacity: 0.8;
}

.balance {
    font-size: 36px;
    font-weight: bold;
    margin-top: 10px;
}

button {
    width: calc(100% - 40px);
    margin: 20px;
    padding: 18px;
    font-size: 20px;
    border-radius: 16px;
    border: none;
    background: #2563eb;
    color: white;
}
</style>
</head>

<body>

<div class="card">
    <div class="title">💳 Игровая карта</div>
    <div class="balance" id="balance">Загрузка...</div>
</div>

<button onclick="sendClick()">🖱 Клик</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Данные пользователя
const user = tg.initDataUnsafe.user;
const userId = user.id;

// Текущий баланс (ТОЛЬКО отображение)
let currentBalance = 0;

// Отправка клика на сервер (боту)
function sendClick() {
    tg.sendData(JSON.stringify({
        action: "click"
    }));
}

// Приём ответа от бота
tg.onEvent("message", function (msg) {
    try {
        const data = JSON.parse(msg.text);
        if (data.balance !== undefined) {
            currentBalance = data.balance;
            document.getElementById("balance").innerText =
                currentBalance + " 💰";
        }
    } catch (e) {
        // игнорируем не наши сообщения
    }
});

// Начальное состояние
document.getElementById("balance").innerText = "0 💰";
</script>

</body>
</html>
