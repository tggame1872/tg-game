<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Telegram Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    margin: 20px;
    padding: 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, #22c55e, #15803d);
}

.balance {
    font-size: 36px;
    margin-top: 10px;
}

button {
    width: calc(100% - 40px);
    margin: 20px;
    padding: 18px;
    font-size: 20px;
    border-radius: 16px;
    border: none;
}
</style>
</head>

<body>

<div class="card">
    💳 Баланс
    <div class="balance" id="balance">Загрузка...</div>
</div>

<button onclick="clickMoney()">🖱 Клик</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;
const USER_ID = user.id;

// ⚠️ ВРЕМЕННО: адрес сервера
const API = "http://ТВОЙ_IP:8000";

async function getBalance() {
    const res = await fetch(API + "/balance", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: USER_ID})
    });
    const data = await res.json();
    document.getElementById("balance").innerText =
        data.balance + " 💰";
}

async function clickMoney() {
    const res = await fetch(API + "/click", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: USER_ID})
    });
    const data = await res.json();
    document.getElementById("balance").innerText =
        data.balance + " 💰";
}

getBalance();
</script>

</body>
</html>
