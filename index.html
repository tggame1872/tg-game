<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DewaNotn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #020617, #000);
    font-family: -apple-system, BlinkMacSystemFont, Arial;
    color: white;
}

.header {
    padding: 20px;
    font-size: 22px;
    font-weight: 600;
}

.card {
    margin: 16px;
    padding: 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 10px 40px rgba(34,197,94,.4);
}

.card-title {
    font-size: 14px;
    opacity: .8;
}

.balance {
    margin-top: 12px;
    font-size: 40px;
    font-weight: 700;
}

.click-area {
    margin: 40px 16px;
    padding: 26px;
    border-radius: 22px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(37,99,235,.4);
    user-select: none;
    transition: transform .08s ease;
}

.click-area:active {
    transform: scale(0.96);
}

.footer {
    text-align: center;
    opacity: .4;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">DewaNotn</div>

<div class="card">
    <div class="card-title">💳 Баланс</div>
    <div class="balance" id="balance">0 💰</div>
</div>

<div class="click-area" onclick="fakeClick()">
    🖱 Нажать
</div>

<div class="footer">Powered by Telegram</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

/*
 ВРЕМЕННО:
 делаем локальный клик,
 чтобы UI был ЖИВОЙ
*/
let balance = 0;

function fakeClick() {
    balance++;
    document.getElementById("balance").innerText =
        balance + " 💰";
}
</script>

</body>
</html>
