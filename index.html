<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NeoApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    background: linear-gradient(180deg,#020617,#000);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
    color: #fff;
}

/* ===== ANIMATIONS ===== */
.fade { animation: fade .35s ease; }
@keyframes fade { from {opacity:0;transform:translateY(10px)} to {opacity:1} }

/* ===== HEADER ===== */
.header {
    padding: 22px 20px 12px;
    font-size: 26px;
    font-weight: 800;
}

/* ===== CARD ===== */
.card {
    margin: 16px;
    padding: 24px;
    border-radius: 26px;
    background:
        radial-gradient(circle at top left,rgba(255,255,255,.18),transparent 40%),
        linear-gradient(135deg,#22c55e,#15803d);
    box-shadow:0 20px 60px rgba(34,197,94,.45);
}

.card-label { font-size:13px;opacity:.85 }
.card-balance { margin-top:14px;font-size:42px;font-weight:800 }

/* ===== BLOCK ===== */
.block {
    margin: 16px;
    padding: 18px;
    border-radius: 22px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
}

/* ===== ROW ===== */
.row {
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:15px;
}
.row:last-child { border-bottom:none }

/* ===== BUTTON ===== */
.btn {
    margin: 16px;
    padding: 22px;
    border-radius: 22px;
    background: linear-gradient(135deg,#2563eb,#1e40af);
    text-align:center;
    font-size:20px;
    font-weight:700;
    box-shadow:0 14px 40px rgba(37,99,235,.5);
    transition:.1s;
}
.btn:active { transform:scale(.96) }

/* ===== TAB BAR ===== */
.tabs {
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.08);
}
.tab {
    flex:1;
    padding:14px 0 18px;
    text-align:center;
    font-size:12px;
    opacity:.5;
}
.tab.active { opacity:1 }

/* ===== PAGE ===== */
.page { display:none; padding-bottom:90px }
.page.active { display:block }
</style>
</head>

<body>

<div class="header" id="title">NeoCard</div>

<!-- HOME -->
<div class="page active fade" id="home">
    <div class="card">
        <div class="card-label">💳 Баланс</div>
        <div class="card-balance" id="balance">—</div>
    </div>
    <div class="btn" onclick="fakeAdd()">💰 Получить</div>
</div>

<!-- TASKS -->
<div class="page fade" id="tasks">
    <div class="block">
        <div class="row"><span>Подписаться на канал</span><span>+100</span></div>
        <div class="row"><span>Зайти 3 дня подряд</span><span>+250</span></div>
        <div class="row"><span>Пригласить друга</span><span>+500</span></div>
    </div>
</div>

<!-- REWARDS -->
<div class="page fade" id="rewards">
    <div class="block">
        <div class="row"><span>🎁 Бронзовый кейс</span><span>Открыть</span></div>
        <div class="row"><span>🎁 Серебряный кейс</span><span>Открыть</span></div>
        <div class="row"><span>🎁 Золотой кейс</span><span>Открыть</span></div>
    </div>
</div>

<!-- PROFILE -->
<div class="page fade" id="profile">
    <div class="block">
        <div class="row"><span>ID</span><span id="uid">—</span></div>
        <div class="row"><span>Статус</span><span>Активен</span></div>
        <div class="row"><span>Уведомления</span><span>Вкл</span></div>
    </div>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="openTab('home','NeoCard')">🏠<br>Дом</div>
    <div class="tab" onclick="openTab('tasks','Задания')">📋<br>Задания</div>
    <div class="tab" onclick="openTab('rewards','Награды')">🎁<br>Кейсы</div>
    <div class="tab" onclick="openTab('profile','Профиль')">⚙️<br>Профиль</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;
document.getElementById("uid").innerText = user.id;

let balance = 0;

function fakeAdd(){
    balance++;
    document.getElementById("balance").innerText = balance + " ₽";
}

function openTab(id,title){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.getElementById("title").innerText = title;

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    event.currentTarget.classList.add("active");
}
</script>

</body>
</html>
