<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NeoCard v3</title>

<!-- TELEGRAM -->
<script src="https://telegram.org/js/telegram-web-app.js?v=3"></script>

<!-- VERSIONING -->
<meta name="version" content="3">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">

<style>
/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
    background:linear-gradient(180deg,#020617,#000);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
    color:#fff;
    min-height:100vh;
}

/* ================= ANIMATIONS ================= */
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1}}

/* ================= HEADER ================= */
.header{
    padding:22px 20px 10px;
    font-size:26px;
    font-weight:800;
}

/* ================= CARD ================= */
.card{
    margin:16px;
    padding:26px;
    border-radius:28px;
    background:
        radial-gradient(circle at top left,rgba(255,255,255,.25),transparent 45%),
        linear-gradient(135deg,#22c55e,#15803d);
    box-shadow:0 20px 60px rgba(34,197,94,.45);
}
.card-label{font-size:13px;opacity:.85}
.card-balance{margin-top:16px;font-size:42px;font-weight:800}

/* ================= BLOCK ================= */
.block{
    margin:16px;
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(14px);
}

/* ================= ROW ================= */
.row{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:15px;
}
.row:last-child{border-bottom:none}

/* ================= BUTTON ================= */
.btn{
    margin:16px;
    padding:22px;
    border-radius:22px;
    background:linear-gradient(135deg,#2563eb,#1e40af);
    text-align:center;
    font-size:20px;
    font-weight:700;
    box-shadow:0 14px 40px rgba(37,99,235,.5);
    transition:.12s;
}
.btn:active{transform:scale(.96)}

/* ================= TABS ================= */
.tabs{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.08);
}
.tab{
    flex:1;
    padding:14px 0 18px;
    text-align:center;
    font-size:12px;
    opacity:.45;
}
.tab.active{opacity:1}

/* ================= PAGES ================= */
.page{display:none;padding-bottom:92px}
.page.active{display:block}
</style>
</head>

<body>

<div class="header" id="title">NeoCard</div>

<!-- HOME -->
<div class="page active fade" id="home">
    <div class="card">
        <div class="card-label">💳 Баланс</div>
        <div class="card-balance" id="balance">0 ₽</div>
    </div>
    <div class="btn" onclick="add()">💰 Получить</div>
</div>

<!-- TASKS -->
<div class="page fade" id="tasks">
    <div class="block">
        <div class="row"><span>Подписаться на канал</span><span>+100</span></div>
        <div class="row"><span>Зайти 3 дня подряд</span><span>+250</span></div>
        <div class="row"><span>Пригласить друга</span><span>+500</span></div>
    </div>
</div>

<!-- REWARDS -->
<div class="page fade" id="rewards">
    <div class="block">
        <div class="row"><span>🎁 Бронзовый кейс</span><span>Открыть</span></div>
        <div class="row"><span>🎁 Серебряный кейс</span><span>Открыть</span></div>
        <div class="row"><span>🎁 Золотой кейс</span><span>Открыть</span></div>
    </div>
</div>

<!-- PROFILE -->
<div class="page fade" id="profile">
    <div class="block">
        <div class="row"><span>ID</span><span id="uid">—</span></div>
        <div class="row"><span>Статус</span><span>Активен</span></div>
        <div class="row"><span>Уведомления</span><span>Вкл</span></div>
    </div>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="openTab('home','NeoCard')">🏠<br>Дом</div>
    <div class="tab" onclick="openTab('tasks','Задания')">📋<br>Задания</div>
    <div class="tab" onclick="openTab('rewards','Награды')">🎁<br>Кейсы</div>
    <div class="tab" onclick="openTab('profile','Профиль')">⚙️<br>Профиль</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let balance = 0;
const user = tg.initDataUnsafe?.user;

if(user){
    document.getElementById("uid").innerText = user.id;
}

function add(){
    balance++;
    document.getElementById("balance").innerText = balance + " ₽";
}

function openTab(id,title){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.getElementById("title").innerText = title;

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    event.currentTarget.classList.add("active");
}
</script>

<!-- VERSION MARKER v3 -->
</body>
</html>
